<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/poll-form.css">
    <title>WD130 | HTML Form - User Poll</title>
</head>
<body>
    <header>
        <h1>WD130 | HTML Form - User Poll</h1>
    </header>
    <main>
        <form>
            <fieldset>
                <legend>Contact Information</legend>
                <div class="form-item">
                        <div class="column2">
                            <label for="fullname">Fullname</label>
                            <input type="text" id="fullname" name="full name" required>
                        </div>
                    <div class="column2">
                        <label for="useremail">Email</label>
                        <input type="email" id="useremail" name="useremail" required>
                    </div>
            </fieldset>     
            
            <fieldset>
                <legend>Questions</legend>
                <div class="column1">
                    <label for="browser">What is your favorite internet browser?</label>
                    <select name="browser" id="browser">
                        <option value="chrome">Google Chrome</option>
                        <option value="safari">Safari</option>
                        <option value="firefox">Firefox</option>
                    </select>
                </div>
                <div class="column1">
                    <label for="pet">Do you have a household pet?</label>
                    <input type="checkbox" id="pet" name="pet">
                </div>
                <label for="feedback">List the places you have lived:</label>
                <textarea name="feedback" id="feedback" rows="4" placeholder="Stillwater Florida, Amsterdam Netherlands, Timbuktu Mali"></textarea>
            </fieldset>
            </div>
            <button type="submit">Submit Poll</button>
        </form>
    </main>
    <footer>
        <p> Copyright 2026 | WDD130 | Conner Monson</p>
    </footer>
</body>
</html>

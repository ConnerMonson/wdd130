<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="White Water rafting company contact us page. reach out to find the right adventure for you. ">
    <meta name="author" content="Conner Monson">
    <link rel="stylesheet" href="styles/rafting.css">
    <title>Contact Us Page </title>
</head>

<body>
    <header>
        <img src="images/rafting-logo-vector.jpg" alt="white water rafting logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <h3>Apex Rafting Outfitters</h3>
        <div class="company-information">
            <p>1234 NS America River Dr, Texas, USA </p>
            <p>+1 800-WET-RAFT</p>
            <p>info@ApexRaftingOutfitters.com</p>
        </div>
        <section class="grid-section">
            <form class="form">
                <div class="message-form">
                    <label for="username">Name
                        <input type="text" name="username" id="username">
                </div>
                <div class="message-form">
                    <label for="useremail">Email</label>
                    <input type="text" name="useremail" id="useremail">
                </div>
                <div class="radio-form">
                    <label for="purpose">Message Purpose</label>
                    <div class="radio-grid">
                        <input type="radio" name="purpose" value="general">General Inquiry
                        <input type="radio" name="purpose" value="reservation"> Reservation Request
                        <input type="radio" name="purpose" value="website"> Website Suggestion
                    </div>
                </div>
                <div class="message-form">
                    <label for="user-message">Message</label>
                    <textarea name="user-message" id="user-message"></textarea>
                </div>
                <div class="message-checkbox">
                    <label for="subscribe">Subscribe to the Monthly Newsletter</label>
                    <input type="checkbox">

                </div>
                <button type="submit">Get in Touch!</button>
            </form>
            <div class="googlemap">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d26925.17944989701!2d-111.84406616038706!3d36.110521257453556!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x80cc0654bd27e08d%3A0xb1c2554442d42e8d!2sGrand%20Canyon!5e1!3m2!1sen!2sus!4v1774977042332!5m2!1sen!2sus"
                  width="450" height="400" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
        </section> <!--Form and Google map -->
        <section>
            <h2>We Are Here to Serve You</h2>
            <div class="employee-images">
                <figure>
                    <img src="images/employee-image-1.jpg" alt="Rafting Employee">
                    <figcaption>Frederick Marquee</figcaption>
                </figure>
                <figure>
                    <img src="images/employee-image-2.jpg" alt="Rafting Employee">
                    <figcaption>Anthony Black</figcaption>
                </figure>
                <figure>
                    <img src="images/employee-image-3.jpg" alt="Rafting Employee">
                    <figcaption>Gary Gray</figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer>
        <p> &copy; | 2026 | Apex Rafting Outfitters | Conner Monson</p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com/">
                <img src="images/facebook-logo.svg" alt="facebook logo"></a>
            <a href="https://www.instagram.com/">
                <img src="images/instagram-logo.svg" alt="instagram logo"></a>
            <a href="https://www.youtube.com/">
                <img src="images/youtube-logo.svg" alt="youtube logo"></a>
        </nav>
    </footer>
</body>

</html>
